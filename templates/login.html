{% extends "base.html" %}

{% block title %}Log In — Creatora AI{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-5 col-md-8">
      <!-- Main Login Form -->
      <div class="glass-card p-4 p-md-5">
        <div class="text-center mb-4">
          <h2 class="fw-bold text-white mb-1">Welcome Back</h2>
          <p class="text-muted small">Sign in with your registered user account</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <div class="mb-3">
            <label for="loginEmail" class="form-label">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-envelope"></i></span>
              <input type="email" class="form-control" id="loginEmail" name="email" placeholder="name@example.com" required autofocus>
            </div>
          </div>

          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center">
              <label for="loginPassword" class="form-label">Password</label>
              <a href="{{ url_for('auth.forgot_password') }}" class="small text-info text-decoration-none">Forgot password?</a>
            </div>
            <div class="input-group">
              <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-key"></i></span>
              <input type="password" class="form-control" id="loginPassword" name="password" placeholder="••••••••" required>
            </div>
          </div>

          <div class="mb-4 form-check">
            <input type="checkbox" class="form-check-input" id="rememberMe" name="remember">
            <label class="form-check-label small text-muted" for="rememberMe">Remember this browser</label>
          </div>

          <button type="submit" class="btn btn-primary-glow w-100 py-3 fw-bold" id="submitLoginBtn">
            Sign In to Creatora <i class="bi bi-box-arrow-in-right ms-1"></i>
          </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-25 small text-muted">
          Access is available to registered users.
          <a href="{{ url_for('auth.register') }}" class="btn btn-glass btn-sm ms-2">Register</a>
        </div>
        <div class="text-center mt-3 small">
          <a href="{{ url_for('admin.login') }}" class="text-muted text-decoration-none"><i class="bi bi-shield-lock me-1"></i>Administrator login</a>
        </div>
      </div>

    </div>
  </div>
</div>
{% endblock %}
