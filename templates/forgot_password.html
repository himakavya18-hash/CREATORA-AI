{% extends "base.html" %}

{% block title %}Reset Password — Creatora AI{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-5 col-md-7">
      <div class="glass-card p-4 p-md-5 text-center">
        <div class="stat-icon bg-info bg-opacity-25 text-info mx-auto mb-3">
          <i class="bi bi-shield-lock fs-2"></i>
        </div>
        <h2 class="fw-bold text-white mb-2">Password Recovery</h2>
        <p class="text-muted small mb-4">Enter your registered email address to receive password reset instructions.</p>

        <form method="POST" action="{{ url_for('auth.forgot_password') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <div class="mb-4 text-start">
            <label for="resetEmail" class="form-label">Email Address</label>
            <input type="email" class="form-control" id="resetEmail" name="email" placeholder="name@example.com" required>
          </div>

          <button type="submit" class="btn btn-primary-glow w-100 py-3 mb-3">
            Send Reset Instructions <i class="bi bi-envelope-arrow-up ms-1"></i>
          </button>
        </form>

        <a href="{{ url_for('auth.login') }}" class="small text-muted text-decoration-none">
          <i class="bi bi-arrow-left me-1"></i> Back to Login
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
