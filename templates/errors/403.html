{% extends "base.html" %}

{% block title %}Access Denied (403) — Creatora AI{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="glass-card p-5 mx-auto border-glow" style="max-width: 600px;">
    <div class="display-1 fw-bold text-danger mb-2 font-monospace">403</div>
    <h2 class="h3 fw-bold text-white mb-3">Unauthorized Access</h2>
    <p class="text-muted small mb-4">
      You do not have the required role or authorization permissions to view this workspace resource.
    </p>
    <a href="{{ url_for('auth.home') }}" class="btn btn-primary-glow">
      <i class="bi bi-shield-lock me-1"></i> Return Home
    </a>
  </div>
</div>
{% endblock %}
