{% extends "base.html" %}

{% block title %}System Error (500) — Creatora AI{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="glass-card p-5 mx-auto border-glow" style="max-width: 600px;">
    <div class="display-1 fw-bold text-warning mb-2 font-monospace">500</div>
    <h2 class="h3 fw-bold text-white mb-3">Unexpected System Disruption</h2>
    <p class="text-muted small mb-4">
      An internal server condition was encountered. Our automated monitoring has recorded this event.
    </p>
    <a href="{{ url_for('auth.home') }}" class="btn btn-primary-glow">
      <i class="bi bi-arrow-repeat me-1"></i> Return to Homepage
    </a>
  </div>
</div>
{% endblock %}
